name: Lint Commit Message

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # commitlint-github-action lists PR commits via the API on pull_request events

env:
  HUSKY_SKIP: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the action can lint the whole commit range
      - uses: wagoid/commitlint-github-action@v6
