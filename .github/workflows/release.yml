name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger

# Disable husky hook installation in CI (the `prepare` script checks this).
env:
  HUSKY_SKIP: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the "Version Packages" PR + release tags
  pull-requests: write # open/update the version PR
  id-token: write # required for npm OIDC trusted publishing (provenance)

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    # Publishing is scoped to this repo; skip on forks so their pushes
    # to main don't attempt to publish.
    if: github.repository == 'ui5-community/jsx-runtime'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the library so its `dist/` exists before `changeset publish`
      # packs it. (The library's `prepublishOnly` also rebuilds, but doing
      # it here surfaces build failures as a distinct, visible step.)
      - name: Build library
        run: pnpm --filter @ui5-community/jsx-runtime build

      # npm auth. We always write the automation token to ~/.npmrc so the
      # publish authenticates regardless of repo visibility. Provenance
      # (npm OIDC trusted publishing) additionally requires a PUBLIC repo,
      # so we only enable it when the repo is public — forcing it on a
      # private repo makes `npm publish` fail. This makes the workflow work
      # unchanged across the private → public transition.
      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

      - name: Determine provenance eligibility
        id: prov
        run: |
          # Provenance needs a public repo + id-token; enable it only then.
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release-publish
          commit: "chore(release): publish"
          title: "chore(release): publish"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Only set on a public repo; empty (unset) on a private one.
          NPM_CONFIG_PROVENANCE: ${{ steps.prov.outputs.enabled == 'true' && 'true' || '' }}
