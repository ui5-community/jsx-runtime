# Home
home.title=JSX Runtime for UI5
home.subtitle=Pick a concept on the left to see it in action.

# Hello
hello.title=jsx() + <Fragment> + falsy filter
hello.description=The smallest possible TSX view: a page containing controls constructed from JSX. Falsy children (null, undefined, false, "") are silently dropped so patterns like {flag && <X/>} Just Work.
hello.paragraph=This paragraph was assembled from a fragment.
hello.line1=First line
hello.line2=Second line

# For
for.title=<For each={binding}>
for.description=Sugar over the bound-aggregation-with-template pattern. The render prop produces the template; UI5 clones it per row.

# If
if.title=<If condition={...}>
if.description=Two modes: literal boolean (children inlined or dropped) and bound (each child's visible is bound to the condition).
if.toggle=Toggle visibility
if.shown=I'm visible when the toggle is on.

# Switch
switch.title=<Switch> / <Case> / <Default> (plugin)
switch.description=Opt in via withScope. Literal on picks one branch; bound on emits every branch with a visible expression binding.
switch.picker=Kind
switch.info=Info branch content
switch.warning=Warning branch content
switch.error=Error branch content
switch.default=No selection: default branch

# Events
events.title=Event handlers
events.description=Two ways to wire a handler: ".dotHandler" strings resolve against the surrounding view's controller at fire-time, and direct function references resolve `this` via UI5's [fn, listener] form.
events.dotButton=.dotHandler
events.fnButton=fn ref
events.status=No button clicked yet.

# Binding
binding.title=Bound aggregation with template
binding.description=Set items=BindingInfo on a list and give it a JSX child; the child becomes the template.
