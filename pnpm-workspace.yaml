packages:
  - "packages/*"

# Approve build scripts for UI5 tooling packages that require them.
# See https://pnpm.io/settings#allowedbuildingbuilds
allowBuilds:
  ui5-tooling-modules: true
  ui5-tooling-transpile: true

# Exempt from the minimumReleaseAge supply-chain policy. ui5-tooling-*
# ships frequent releases and a fresh patch can land inside a policy's
# release-age cutoff window, which blocks `pnpm install` / `pnpm run`
# until the version ages out. These are trusted UI5 build tools, so we
# opt them out to keep installs and local scripts working on the latest
# patch. See https://pnpm.io/settings#minimumreleaseageexclude
minimumReleaseAgeExclude:
  - ui5-tooling-modules
  - ui5-tooling-transpile

# Version overrides. mermaid@11 pulls in d3-contour@4 which needs
# d3-array@3.x (for `blur2`), and mermaid's own d3 chunk expects
# d3-shape@3.x (for `curveBumpX` et al.). Transitive dependencies
# somewhere else in the tree drag in the 2.x / 1.x majors, so pin
# the newer majors to match what the reference app hoists.
overrides:
  d3-array: "^3.2.0"
  d3-shape: "^3.2.0"
  d3-color: "^3.1.0"
  d3-interpolate: "^3.0.1"
  d3-path: "^3.1.0"
  d3-scale: "^4.0.2"
  d3-time: "^3.1.0"
  d3-time-format: "^4.1.0"
  d3-format: "^3.1.0"
